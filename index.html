<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Block Blast X</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="menu" class="screen">
  <div class="logo">BLOCK<br><span>BLAST</span> <b>X</b></div>
  <p>ПЕРЕТАСКИВАЙ • СОБИРАЙ • УНИЧТОЖАЙ</p>

  <button id="playBtn">▶ ИГРАТЬ</button>
  <button id="shopBtn" class="dark">🛒 МАГАЗИН</button>

  <div class="stats">
    🪙 <span id="menuCoins">0</span>
    &nbsp;&nbsp;&nbsp;
    🏆 <span id="menuBest">0</span>
  </div>
</div>


<div id="game" class="hidden">

  <header>
    <button id="pauseBtn">⏸</button>

    <div>
      <small>СЧЁТ</small>
      <strong id="score">0</strong>
    </div>

    <div>
      <small>РЕКОРД</small>
      <strong id="best">0</strong>
    </div>

    <div>
      🪙 <strong id="coins">0</strong>
    </div>
  </header>

  <div id="combo">
    COMBO ×<span id="comboNumber">0</span>
  </div>

  <div id="board"></div>

  <div class="hint">
    👆 Зажми фигуру и перетащи её на поле
  </div>

  <div id="pieces"></div>

  <div class="powers">

    <button id="bombBtn">
      💣
      <span>БОМБА</span>
      <b id="bombCount">0</b>
    </button>

    <button id="lineBtn">
      ⚡
      <span>ЛИНИЯ</span>
      <b id="lineCount">0</b>
    </button>

    <button id="undoBtn">
      ↩️
      <span>ОТМЕНА</span>
      <b id="undoCount">0</b>
    </button>

  </div>
</div>


<div id="shop" class="screen hidden">

  <button id="backBtn" class="back">← НАЗАД</button>

  <h1>🛒 МАГАЗИН</h1>

  <div class="shopCoins">
    🪙 <span id="shopCoins">0</span>
  </div>

  <div class="shopGrid">

    <div class="card">
      <div>💣</div>
      <h2>БОМБА</h2>
      <p>Уничтожает блоки вокруг клетки.</p>
      <button class="buy" data-item="bomb">🪙 100</button>
    </div>

    <div class="card">
      <div>⚡</div>
      <h2>ЛИНИЯ</h2>
      <p>Очищает целый ряд.</p>
      <button class="buy" data-item="line">🪙 150</button>
    </div>

    <div class="card">
      <div>↩️</div>
      <h2>ОТМЕНА</h2>
      <p>Возвращает последний ход.</p>
      <button class="buy" data-item="undo">🪙 200</button>
    </div>

  </div>
</div>


<div id="gameOver" class="screen hidden">

  <div class="dead">💀</div>

  <h1>ИГРА ОКОНЧЕНА</h1>

  <div class="final">
    <small>СЧЁТ</small>
    <strong id="finalScore">0</strong>
  </div>

  <div class="earned">
    🪙 +<span id="earnedCoins">0</span>
  </div>

  <button id="retryBtn">🔄 ЕЩЁ РАЗ</button>
  <button id="overMenuBtn" class="dark">🏠 МЕНЮ</button>

</div>


<div id="pause" class="overlay hidden">

  <div class="pauseBox">

    <h1>⏸️ ПАУЗА</h1>

    <button id="resumeBtn">▶ ПРОДОЛЖИТЬ</button>
    <button id="pauseMenuBtn" class="dark">🏠 МЕНЮ</button>

  </div>

</div>


<script src="script.js"></script>

</body>
</html>
