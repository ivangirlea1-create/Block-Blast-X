<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>BLOCK BLAST X</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- МЕНЮ -->
  <div id="menu" class="screen">

    <div class="logo">
      🧱
      <span>BLOCK</span>
      BLAST
      <b>X</b>
    </div>

    <p class="subtitle">
      СОБЕРИ ЛИНИЮ • УНИЧТОЖЬ БЛОКИ
    </p>

    <button id="playBtn" class="bigBtn">
      ▶ ИГРАТЬ
    </button>

    <button id="shopMenuBtn" class="bigBtn darkBtn">
      🛒 МАГАЗИН
    </button>

    <div class="menuStats">
      <div>
        🪙 <span id="menuCoins">0</span>
      </div>

      <div>
        🏆 <span id="menuBest">0</span>
      </div>
    </div>

  </div>


  <!-- ИГРА -->
  <div id="game" class="hidden">

    <header class="top">

      <button id="pauseBtn">
        ⏸️
      </button>

      <div class="stat">
        SCORE
        <strong id="score">0</strong>
      </div>

      <div class="stat">
        BEST
        <strong id="best">0</strong>
      </div>

      <div class="stat">
        🪙
        <strong id="coins">0</strong>
      </div>

    </header>


    <!-- КОМБО -->
    <div id="combo">
      COMBO x<span id="comboNumber">0</span>
    </div>


    <!-- ПОЛЕ -->
    <main>

      <div id="board"></div>

    </main>


    <!-- ФИГУРЫ -->
    <section class="piecesTitle">
      ВЫБЕРИ ФИГУРУ
    </section>

    <div id="pieces"></div>


    <!-- СПОСОБНОСТИ -->
    <div class="powers">

      <button id="bombBtn">
        💣
        <span>БОМБА</span>
        <b id="bombCount">0</b>
      </button>

      <button id="lineBtn">
        ⚡
        <span>МОЛНИЯ</span>
        <b id="lineCount">0</b>
      </button>

      <button id="undoBtn">
        ↩️
        <span>ОТМЕНА</span>
        <b id="undoCount">0</b>
      </button>

    </div>

  </div>


  <!-- МАГАЗИН -->
  <div id="shop" class="screen hidden">

    <button id="backMenuBtn" class="backBtn">
      ← НАЗАД
    </button>

    <h1>🛒 МАГАЗИН</h1>

    <div class="shopCoins">
      🪙 <span id="shopCoins">0</span>
    </div>


    <div class="shopGrid">

      <div class="shopCard">

        <div class="shopIcon">💣</div>

        <h2>БОМБА</h2>

        <p>
          Уничтожает блоки вокруг выбранной клетки.
        </p>

        <button class="buyBtn" data-item="bomb">
          🪙 100
        </button>

      </div>


      <div class="shopCard">

        <div class="shopIcon">⚡</div>

        <h2>МОЛНИЯ</h2>

        <p>
          Очищает целую линию.
        </p>

        <button class="buyBtn" data-item="line">
          🪙 150
        </button>

      </div>


      <div class="shopCard">

        <div class="shopIcon">↩️</div>

        <h2>ОТМЕНА</h2>

        <p>
          Возвращает последний ход.
        </p>

        <button class="buyBtn" data-item="undo">
          🪙 200
        </button>

      </div>

    </div>

  </div>


  <!-- GAME OVER -->
  <div id="gameOver" class="screen hidden">

    <div class="gameOverIcon">
      💀
    </div>

    <h1>ИГРА ОКОНЧЕНА</h1>

    <div class="finalScore">
      <span>СЧЁТ</span>
      <strong id="finalScore">0</strong>
    </div>

    <div class="earned">
      🪙 +<span id="earnedCoins">0</span>
    </div>

    <button id="retryBtn" class="bigBtn">
      🔄 ЕЩЁ РАЗ
    </button>

    <button id="gameOverMenuBtn" class="bigBtn darkBtn">
      🏠 МЕНЮ
    </button>

  </div>


  <!-- ПАУЗА -->
  <div id="pauseScreen" class="overlay hidden">

    <div class="pauseBox">

      <h1>⏸️ ПАУЗА</h1>

      <button id="resumeBtn" class="bigBtn">
        ▶ ПРОДОЛЖИТЬ
      </button>

      <button id="pauseMenuBtn" class="bigBtn darkBtn">
        🏠 МЕНЮ
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
